<!DOCTYPE html>
<html>
<head>
  <title>Smart Classroom Monitoring</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* IMPORTANT: no scroll */
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .page {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }

    .header {
      flex: 0 0 auto;
    }

    .header h2 {
      margin: 0;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: #666;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .live img {
      /* width: 100%;
      height: 100%; */
      object-fit: contain;
      border-radius: 6px;
      border: 3px solid #4CAF50;
    }

    .status {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .count {
      font-size: 56px;
      font-weight: bold;
      color: #4CAF50;
      margin: 10px 0;
    }

    .faces-section {
      flex: 0 0 30%;
      min-height: 0;
    }

    .faces-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      overflow: hidden;
    }

    .faces-grid img {
      width: 90px;
      border-radius: 6px;
      border: 2px solid #4CAF50;
    }

    #joystick {
  width: 200px;
  height: 200px;
  background: #333;
  border-radius: 50%;
  position: relative;
  margin: auto;
  touch-action: none;
}

#stick {
  width: 70px;
  height: 70px;
  background: #0f0;
  border-radius: 50%;
  position: absolute;
  top: 65px;
  left: 65px;
}
  </style>

  <script>
    

    let lastCmd = null; // debounce Arduino command
    let lastState = null; // 'OPEN' or 'CLOSED'
    
    /* ================= ARDUINO ================= */
    function sendCmd(cmd) {
     fetch("/control?cmd=" + cmd)
      .then(res => res.text())
      .then(data => console.log(data))
      .catch(err => console.error(err));
    }

    function refreshFaces() {
      // hidden full capture (optional)
      document.getElementById("capture").src =
        "/static/capture.jpg?t=" + Date.now();

      const container = document.getElementById("faces");
      container.innerHTML = "";

      for (let i = 1; i <=1; i++) {
        let img = new Image();
        img.src = `/static/faces/face_${i}.jpg?t=` + Date.now();
        img.onerror = () => img.remove();
        container.appendChild(img);
      }

      setTimeout(() => {
        document.getElementById("count").innerText =
          container.children.length;
      }, 150);
    }

    setInterval(refreshFaces, 1000);
  </script>
</head>

<body>

<div class="page">

  <!-- HEADER -->
  <div class="header">
    <h2>Smart Classroom Monitoring System</h2>
    <p>Real-time face detection and automatic capture (Offline)</p>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main">

    <!-- LIVE FEED -->
    <div class="card live">
      <h3>Live Camera Feed</h3>
      <div >
        <img src="/video">
      </div>
    </div>

    <!-- STATUS -->
    <div class="card status">
      <h3>Controller </h3>
      <button onmousedown="sendCmd('F')"  onmouseup="sendCmd(0)">lights On</button>
      <p style="color:#666;font-size:14px;">
        Auto-capture on face detection
      </p>

      <div id="joystick">
        <div id="stick"></div>
      </div>

      <p>X: <span id="x">0</span> | Y: <span id="y">0</span></p>
    </div>

  </div>

  <!-- FACES -->
  <div class="card faces-section">
    <h3>Captured Faces</h3>
    <img id="capture" hidden>
    <div class="faces-grid" id="faces"></div>
  </div>

</div>

<script>
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const xOut = document.getElementById("x");
const yOut = document.getElementById("y");

let dragging = false;
const radius = 100;
const stickRadius = 35;

joystick.addEventListener("pointerdown", () => dragging = true);
document.addEventListener("pointerup", () => {
  dragging = false;
  stick.style.left = "65px";
  stick.style.top = "65px";
  xOut.innerText = 0;
  yOut.innerText = 0;

  if (lastCmd !== '0') {
    sendCmd('0');
    lastCmd = '0';
  }
});

document.addEventListener("pointermove", e => {
  if (!dragging) return;

  const rect = joystick.getBoundingClientRect();
  let x = e.clientX - rect.left - radius;
  let y = e.clientY - rect.top - radius;

  const dist = Math.sqrt(x*x + y*y);
  if (dist > radius) {
    x = x / dist * radius;
    y = y / dist * radius;
  }

  stick.style.left = (x + radius - stickRadius) + "px";
  stick.style.top  = (y + radius - stickRadius) + "px";

  xOut.innerText = Math.round((x / radius) * 100);
  yOut.innerText = Math.round((-y / radius) * 100);

  const DEADZONE = 20;

  if (y < -50 && lastCmd !== 'F') {
    sendCmd('F');
    lastCmd = 'F';

  } else if (y > 50 && lastCmd !== 'B') {
    sendCmd('B');
    lastCmd = 'B';

  } else if (x < -50 && lastCmd !== 'L') {
    sendCmd('L');
    lastCmd = 'L';

  } else if (x > 50 && lastCmd !== 'R') {
    sendCmd('R');
    lastCmd = 'R';

  } else if (Math.abs(x) < DEADZONE && Math.abs(y) < DEADZONE && lastCmd !== 'S') {
    sendCmd('S');
    lastCmd = '0';
  }
});

</script>
</body>
</html>
